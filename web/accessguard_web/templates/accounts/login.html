{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>
  <p class="small muted"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a> · <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
