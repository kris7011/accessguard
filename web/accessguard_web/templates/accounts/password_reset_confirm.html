{% extends "base.html" %}{% block title %}Choose a new password{% endblock %}
{% block content %}<div class="narrow card"><h1>Choose a new password</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_div }}<button class="btn btn-primary" type="submit">Save password</button></form>
{% else %}<p>This reset link is not valid any more. Request a new one.</p>{% endif %}</div>{% endblock %}
