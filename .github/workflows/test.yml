name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit `shell: bash` runs steps with `-eo pipefail`, so a failing command in a pipeline
# cannot be hidden. The verification steps themselves never pipe a command's exit code.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, types, security scans, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag shown for readability).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e . -e ./lab -e ./evaluations
      - name: Lint, format, types, dependency audit, secret scan, build
        run: bash ops/verify.sh lint format types audit secrets build

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The runtime has no third-party dependencies: tests and demo run without installing.
      - name: Tests and before/after demo (bash)
        if: runner.os != 'Windows'
        run: bash ops/verify.sh tests demo
      - name: Tests and before/after demo (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ops/verify.ps1 -Steps tests,demo
