name: CI

# Feature branches are checked through their pull request only; an unfiltered `push` trigger
# would run the whole matrix twice per push (refs/heads/* and refs/pull/*/merge do not share
# a concurrency group), doubling Actions usage.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit `shell: bash` runs steps with `-eo pipefail`, so a failing command in a pipeline
# cannot be hidden. The verification steps themselves never pipe a command's exit code.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, types, security scans, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag shown for readability).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # requirements-e2e.txt (Playwright, no browser download) so mypy sees the same types
      # for ops/dev/browser_check.py as a development machine does.
      - name: Install locked tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt -r requirements-e2e.txt
          python -m pip install --no-deps --no-build-isolation -e . -e ./lab -e ./evaluations -e ./sampleapp
      - name: Lint, format, types, dependency audit, secret scan, build, Django deploy checks
        run: bash ops/verify.sh lint format types audit secrets build migrations deploy-check

  tests:
    name: Engine tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The engine has no third-party dependencies: tests and demo run without installing.
      # tests/unit/test_ml_foundation.py imports nothing from the web package.
      - name: Tests and before/after demo (bash)
        if: runner.os != 'Windows'
        run: bash ops/verify.sh tests demo
      - name: Tests and before/after demo (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ops/verify.ps1 -Steps tests,demo

  web:
    name: Web tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The same pinned image as docker-compose.yml.
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: accessguard
          POSTGRES_USER: accessguard
          POSTGRES_PASSWORD: ci-only-password # pragma: allowlist secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accessguard" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://accessguard:ci-only-password@localhost:5432/accessguard # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked runtime and tooling
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Web tests, migrations check
        run: bash ops/verify.sh web-tests migrations

  image:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web and demo targets (not pushed)
        run: |
          docker build --target web -t accessguard-web:ci .
          docker build --target demo -t accessguard-demo:ci .
